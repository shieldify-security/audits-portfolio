<clipPath id="rd"><rect width="1280" height="170" rx="18"/></clipPath></defs>
<g clip-path="url(#rd)">
<rect width="1280" height="170" fill="#05080c"/><rect width="1280" height="170" fill="url(#g)"/>
<g class="sc"><rect x="0" y="0" width="200" height="170" fill="url(#sg)"/><rect x="198" y="0" width="2" height="170" fill="#08e8ff" fill-opacity=".7"/></g>
<circle cx="70" cy="50" r="6" fill="#08e8ff"/><text x="88" y="55" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="4.4" fill="#fff" textLength="270.9" lengthAdjust="spacingAndGlyphs">SECURITY REVIEW TABLE</text>
<g><rect x="380" y="39" width="62" height="22" rx="11" fill="none" stroke="#08e8ff" stroke-width="1.3"/><circle class="bl" cx="395" cy="50" r="3.5" fill="#08e8ff"/><text x="405" y="55" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#08e8ff" textLength="30.9" lengthAdjust="spacingAndGlyphs">LIVE</text></g>
<line x1="460" y1="50" x2="1216" y2="50" stroke="#fff" stroke-opacity=".25"/>
<text x="64" y="112" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="-.5" fill="#fff" textLength="431.6" lengthAdjust="spacingAndGlyphs">170+ security reviews</text>
<text x="64" y="142" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="15" fill="#aab6b8" textLength="612" lengthAdjust="spacingAndGlyphs">Newest first. <tspan fill="#08e8ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">REPORT</tspan> opens the PDF, <tspan fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SOON</tspan> is on its way, <tspan fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PRIVATE</tspan> stays with the client.</text>
